version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ria_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ria_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - LLM_TEMPERATURE=0.1
      - MAX_DOC_CHARS=12000
      - FETCH_TIMEOUT=15
      - MAX_UPLOAD_MB=20
      - DEFAULT_INDUSTRY=auto
      - MAX_RSS_ENTRIES=10
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ria_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
