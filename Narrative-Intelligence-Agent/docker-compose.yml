version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: nia-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: nia-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - LLM_TEMPERATURE=0.1
      - MAX_ARTICLES=20
      - MAX_ARTICLES_PER_FEED=5
      - SENTIMENT_BATCH_SIZE=4
      - MAX_NARRATIVES=8
      - MAX_PATTERNS=5
      - CONTENT_CHAR_LIMIT=600
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nia-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
