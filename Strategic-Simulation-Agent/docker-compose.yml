version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ssa-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ssa-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - LLM_TEMPERATURE=0.1
      - MAX_DECISION_CHARS=8000
      - DEFAULT_SCENARIOS=4
      - MAX_RISKS=10
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ssa-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
